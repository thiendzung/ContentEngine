name: CI

on:
  push:
    branches: [main, ce01-walking-skeleton]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: contentengine_test
          POSTGRES_USER: contentengine
          POSTGRES_PASSWORD: contentengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contentengine -d contentengine_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      APP_ENV: test
      APP_VERSION: 0.1.0-ce04
      DATABASE_URL: postgresql+asyncpg://contentengine:contentengine@localhost:5432/contentengine
      TEST_DATABASE_URL: postgresql+asyncpg://contentengine:contentengine@localhost:5432/contentengine_test
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend
        run: pip install -r backend/requirements-dev.txt

      - name: Backend lint
        working-directory: backend
        run: ruff check app tests scripts migrations

      - name: Backend types
        working-directory: backend
        run: mypy app

      - name: Run migration round-trip
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade 20260902_0001
          alembic upgrade head

      - name: K2 unchanged reread
        continue-on-error: true
        working-directory: backend
        run: >-
          pytest -q tests/test_k2_knowledge_freshness.py::test_unchanged_reread_creates_observation_without_new_document_version --tb=short

      - name: K2 freshness progression
        continue-on-error: true
        working-directory: backend
        run: >-
          pytest -q tests/test_k2_knowledge_freshness.py::test_freshness_state_progression_reread_and_source_supersession --tb=short

      - name: K2 policy precedence
        continue-on-error: true
        working-directory: backend
        run: >-
          pytest -q tests/test_k2_knowledge_freshness.py::test_topic_policy_is_strictest_and_explicit_target_overrides_it --tb=short

      - name: K2 lifecycle audit
        continue-on-error: true
        working-directory: backend
        run: >-
          pytest -q tests/test_k2_knowledge_freshness.py::test_assignment_replacement_and_policy_retirement_are_audited --tb=short

      - name: K2 candidate lineage
        continue-on-error: true
        working-directory: backend
        run: >-
          pytest -q tests/test_k2_knowledge_freshness.py::test_approved_candidate_is_verifiable_and_unapproved_candidate_is_rejected --tb=short

      - name: K2 DB assignment guards
        continue-on-error: true
        working-directory: backend
        run: >-
          pytest -q tests/test_k2_freshness_db_guards.py::test_database_rejects_cross_project_assignment_and_multiple_targets --tb=short

      - name: K2 DB policy and observation guards
        continue-on-error: true
        working-directory: backend
        run: >-
          pytest -q tests/test_k2_freshness_db_guards.py::test_database_rejects_policy_payload_mutation_and_observation_hash_mismatch --tb=short

      - name: K2 DB verification immutability
        continue-on-error: true
        working-directory: backend
        run: >-
          pytest -q tests/test_k2_freshness_db_guards.py::test_database_rejects_freshness_verification_update --tb=short

      - name: Backend tests
        working-directory: backend
        run: pytest

      - name: Export OpenAPI
        working-directory: backend
        run: python -m scripts.dump_openapi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Generate frontend API types
        working-directory: frontend
        run: npm run gen:types

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Frontend build
        working-directory: frontend
        run: npm run build
