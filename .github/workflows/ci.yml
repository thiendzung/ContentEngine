name: CI

on:
  push:
    branches: [main, ce01-walking-skeleton]
    paths:
      - "backend/**"
      - "frontend/**"
      - "wordpress/**"
      - ".github/workflows/ci.yml"
      - "Makefile"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "wordpress/**"
      - ".github/workflows/ci.yml"
      - "Makefile"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  minimum-confirmation:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: WordPress bridge contract
        run: |
          php -l wordpress/motgu-rank-math-bridge/motgu-rank-math-bridge.php
          php -l wordpress/motgu-rank-math-bridge/src/Bridge.php
          php -l wordpress/motgu-rank-math-bridge/tests/contract-test.php
          php wordpress/motgu-rank-math-bridge/tests/contract-test.php

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend
        run: pip install -r backend/requirements-dev.txt

      - name: Backend lint
        working-directory: backend
        run: ruff check app tests scripts migrations

      - name: Backend types
        working-directory: backend
        run: mypy app

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Verify install inputs stay clean
        run: |
          DIRTY="$(git status --porcelain -- frontend/package-lock.json frontend/next-env.d.ts frontend/tsconfig.json)"
          if [ -n "$DIRTY" ]; then
            printf '%s\n' "$DIRTY"
            echo "Install/typecheck mutated canonical release inputs"
            exit 1
          fi
